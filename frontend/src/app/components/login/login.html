```html id="f6"
<div class="login-container">

  <div class="login-card">

    <h1>Accessible Reading List</h1>
    <p>Please login to continue</p>

    <form (ngSubmit)="login()">

      <input
        type="text"
        placeholder="Username"
        [(ngModel)]="username"
        name="username"
        required
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit">
        Login
      </button>

    </form>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</div>
```
